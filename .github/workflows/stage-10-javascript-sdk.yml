name: Stage 10 JavaScript SDK
on:
  pull_request:
  push:
    branches: [main]
jobs:
  sdk-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run SDK tests
        run: node --test tests/sdk/sdk.test.mjs
      - name: Import SDK
        run: node -e "import('./packages/leruchi-sdk/index.mjs').then(() => console.log('SDK import OK'))"
