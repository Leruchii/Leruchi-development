name: Historical Secret Scan Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-history:
    name: Audit historical Gitleaks findings (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run redacted historical scan
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --report-format json --report-path /tmp/gitleaks-history.json . >/tmp/gitleaks-history.stdout 2>/tmp/gitleaks-history.stderr
          scan_status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path("/tmp/gitleaks-history.json")
          if not report.exists() or not report.read_text().strip():
              print("Historical Gitleaks scan returned no report; inspect scan exit status and stderr.")
              print(Path("/tmp/gitleaks-history.stderr").read_text()[-3000:])
              raise SystemExit(0)
          findings = json.loads(report.read_text())
          safe_fields = ("RuleID", "Description", "File", "Commit", "StartLine", "EndLine", "Fingerprint")
          print(f"Historical findings: {len(findings)} (secret values intentionally omitted)")
          for item in findings:
              print(json.dumps({key: item.get(key) for key in safe_fields}, sort_keys=True))
          PY
          echo "Gitleaks exit status: $scan_status"
          echo "Audit-only run: this job reports redacted evidence; it does not approve suppressions or release."
