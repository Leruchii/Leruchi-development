name: Stage 15 GraphRAG

on:
  pull_request:
    paths:
      - "packages/retrieval-ir/**"
      - "packages/graph-api/**"
      - "packages/mcp-server/**"
      - "tests/mcp/**"
      - "packages/retrieval-fusion/**"
      - "packages/retrieval-contract/**"
      - "packages/retrieval-execution/**"
      - "packages/schema-catalog-api/**"
      - "packages/vector-execution/**"
      - "tests/retrieval-ir/**"
      - "tests/retrieval-fusion/**"
      - "tests/retrieval-execution/**"
      - "tests/security/stage-02-setup.sh"
      - "tests/schema-catalog-api/**"
      - "tests/vector-execution/**"
      - "packages/capability-policy/**"
      - "tests/capability-policy/**"
      - "infra/catalog/**"
      - "infra/migrations/0003-vector-catalog.sql"
      - "knowledge/decisions/stage-15-graphrag.md"
      - ".github/workflows/stage-15-graphrag.yml"
  push:
    branches: [main, stage15-graphrag-retrieval-ir]

jobs:
  retrieval-ir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Retrieval IR contract tests
        run: node --test tests/retrieval-ir/retrieval-ir.test.mjs
      - name: Retrieval fusion contract tests
        run: node --test tests/retrieval-fusion/retrieval-fusion.test.mjs
      - name: Secure hybrid retrieval execution contract tests
        run: node --test tests/retrieval-execution/retrieval-execution.test.mjs
      - name: Tenant-scoped vector catalog contract tests
        run: node --test tests/schema-catalog-api/api.test.mjs
      - name: Capability policy contract tests
        run: node --test tests/capability-policy/capability-policy.test.mjs tests/capability-policy/capability-grants.test.mjs
      - name: Secure vector execution contract tests
        run: node --test tests/vector-execution/vector-execution.test.mjs
      - name: Architecture regression audit
        run: node tests/architecture/contract-audit.mjs

  vector-database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build Leruchi database image
        run: docker compose build db
      - name: Start database
        run: docker compose up -d db
      - name: Wait for database
        run: |
          for i in {1..90}; do
            if docker compose exec -T db pg_isready -U postgres -d leruchi; then exit 0; fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - name: Install Schema Catalog baseline
        run: docker compose exec -T db psql -U postgres -d leruchi -v ON_ERROR_STOP=1 -Xf /dev/stdin < infra/catalog/04-schema-catalog.sql
      - name: Run approved migrations
        env:
          LERUCHI_MIGRATOR_DATABASE_URL: postgresql://vibe_migrator:migrator@127.0.0.1:5432/leruchi
        run: node -e "import('./packages/leruchi-cli/migrate.mjs').then(async ({runMigrations}) => console.log(await runMigrations({cwd:process.cwd()})))"
      - name: Prove tenant-isolated vector retrieval
        env:
          LERUCHI_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/leruchi
          LERUCHI_RUNTIME_DATABASE_URL: postgresql://vibe_runtime:runtime@127.0.0.1:5432/leruchi
        run: node tests/vector-execution/integration.mjs
      - name: Seed AGE tenant isolation fixture
        run: |
          docker compose cp tests/security/stage-02-setup.sh db:/tmp/stage-02-setup.sh
          docker compose exec -T db bash /tmp/stage-02-setup.sh
      - name: Prove real hybrid graph and vector retrieval
        env:
          LERUCHI_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/leruchi
          LERUCHI_RUNTIME_DATABASE_URL: postgresql://vibe_runtime:runtime@127.0.0.1:5432/leruchi
        run: node tests/retrieval-execution/hybrid-integration.mjs
      - name: Prove live MCP GraphRAG retrieval
        env:
          LERUCHI_RUNTIME_DATABASE_URL: postgresql://vibe_runtime:runtime@127.0.0.1:5432/leruchi
        run: node tests/mcp/live-mcp-retrieval.test.mjs
      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Cleanup
        if: always()
        run: docker compose down -v
