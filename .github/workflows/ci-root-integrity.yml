name: CI Root Integrity

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/ci-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-root-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node.js 24 and lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enforce Node.js 24 and manifest-lock consistency
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < .nvmrc)" = "24"
          node --input-type=commonjs <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.engines?.node !== '>=24 <25') {
            throw new Error('package.json must require Node.js >=24 <25');
          }
          if (lock.lockfileVersion !== 3) {
            throw new Error('Expected package-lock.json lockfileVersion 3');
          }
          const root = lock.packages?.[''];
          if (!root) throw new Error('Root package entry is missing from package-lock.json');
          for (const section of ['dependencies', 'devDependencies', 'optionalDependencies']) {
            const declared = pkg[section] || {};
            const locked = root[section] || {};
            for (const [name, version] of Object.entries(declared)) {
              if (locked[name] !== version) {
                throw new Error(
                  `Lockfile mismatch: ${section}.${name}; manifest=${version}, lock=${locked[name] ?? '<missing>'}`
                );
              }
            }
            for (const name of Object.keys(locked)) {
              if (!(name in declared)) {
                throw new Error(`Lockfile has undeclared root ${section}: ${name}`);
              }
            }
          }
          console.log('Node.js policy and root manifest/lockfile declarations are consistent.');
          NODE
          node --version
          npm --version

      - name: Install exact locked dependency tree
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run canonical runtime policy audit
        run: node scripts/assert-runtime-policy.mjs

      - name: Validate tracked JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            case "$file" in
              *.json)
                node -e '
                  const fs = require("node:fs");
                  JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                ' "$file"
                ;;
            esac
          done < <(git ls-files -z -- '*.json')

      - name: Validate tracked shell scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(git ls-files -z -- '*.sh')
