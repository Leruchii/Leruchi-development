name: Stage 07 Apache AGE Compiler

on:
  pull_request:
  push:
    branches: [main]

jobs:
  age-compiler:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build database image
        run: docker compose build db

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database
        run: |
          for i in {1..90}; do
            if docker compose exec -T db pg_isready -U postgres -d leruchi; then exit 0; fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Seed Stage 01 graph
        run: docker compose exec -T db psql -U vibe_runtime -d leruchi -Xf /dev/stdin < tests/db/stage-01.sql

      - name: Run AGE compiler tests
        run: node --test tests/age-compiler/*.test.mjs

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db

      - name: Cleanup
        if: always()
        run: docker compose down -v
