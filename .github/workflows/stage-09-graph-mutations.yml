name: Stage 09 Graph Mutations
on:
  pull_request:
  push:
    branches: [main]
jobs:
  mutation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run mutation unit and adversarial tests
        run: node --test tests/mutation/mutation.test.mjs
      - name: Verify mutation source has no raw client query fields
        run: |
          ! grep -RniE 'ir\.(cypher|sql|raw|statement)' packages/mutation-* packages/compiler-age-mutation || true
