name: Stage 20 Production Readiness
on:
  pull_request:
    paths:
      - "package.json"
      - "packages/**/package.json"
      - "packages/vibe-cli/migrate.mjs"
      - "apps/**/package.json"
      - "infra/migrations/**"
      - "infra/catalog/**"
      - "infra/docker/postgres/**"
      - "scripts/production-readiness-audit.mjs"
      - "scripts/leruchi-backup.sh"
      - "tests/production-readiness/**"
      - "tests/backup-recovery/**"
      - "knowledge/decisions/stage-20-production-readiness.md"
      - "knowledge/operations.md"
      - "knowledge/testing.md"
      - "knowledge/decisions/unknowns-and-contradictions.md"
      - ".github/workflows/stage-20-production-readiness.yml"
      - "BUILD_PLAN.md"
      - "BUILD_STATE.md"
  push:
    branches: [main, stage20-production-readiness]

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --ignore-scripts
      - name: Version, dependency and migration policy audit
        run: node scripts/production-readiness-audit.mjs
      - name: Production readiness policy tests
        run: node --test tests/production-readiness/*.test.mjs
      - name: Build production Leruchi database image
        run: docker build -t leruchi-stage20 -f infra/docker/postgres/Dockerfile .
      - name: Start upgrade source database
        run: |
          docker run -d --name leruchi-stage20-db \
            -p 55434:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=leruchi \
            -e VIBE_MIGRATOR_PASSWORD=migrator \
            -e VIBE_RUNTIME_PASSWORD=runtime \
            -e VIBE_REALTIME_PASSWORD=realtime \
            -v "$GITHUB_WORKSPACE/infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro" \
            leruchi-stage20
          for attempt in $(seq 1 60); do
            if docker exec leruchi-stage20-db pg_isready -U postgres -d leruchi >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs leruchi-stage20-db
          exit 1
      - name: Supported schema upgrade and checksum-drift drill
        env:
          DATABASE_URL: postgresql://vibe_migrator:migrator@127.0.0.1:55434/leruchi
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55434/leruchi
        run: bash tests/production-readiness/upgrade-drill.sh
      - name: Bounded database pool concurrency smoke
        env:
          DATABASE_URL: postgresql://vibe_runtime:runtime@127.0.0.1:55434/leruchi
        run: node tests/production-readiness/concurrency-smoke.mjs
      - name: Database logs on failure
        if: failure()
        run: docker logs leruchi-stage20-db || true
      - name: Stop Stage 20 database
        if: always()
        run: docker rm -f leruchi-stage20-db >/dev/null 2>&1 || true
      - name: Architecture regression audit
        run: node tests/architecture/contract-audit.mjs
