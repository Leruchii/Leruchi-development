name: Secret Scan (Introduced Changes)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-introduced-secrets:
    name: Scan introduced Git changes with Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            echo "value=$PR_BASE_SHA..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            parent="$(git rev-parse "${GITHUB_SHA}^")"
            echo "value=$parent..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan introduced commits
        shell: bash
        env:
          SCAN_RANGE: ${{ steps.range.outputs.value }}
        run: |
          set -euo pipefail
          echo "Scanning introduced commit range: $SCAN_RANGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --exit-code 1 --log-opts="$SCAN_RANGE" .

  audit-historical-findings:
    name: Audit historical Gitleaks findings (redacted)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Report redacted historical findings
        shell: bash
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --report-format json --report-path /repo/.gitleaks-history-report.json . >/tmp/gitleaks-history.stdout 2>/tmp/gitleaks-history.stderr
          scan_status=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path(".gitleaks-history-report.json")
          if not report.exists() or not report.read_text().strip():
              print("No JSON report was produced; inspect the redacted scanner stderr.")
              print(Path("/tmp/gitleaks-history.stderr").read_text()[-3000:])
              raise SystemExit(0)
          findings = json.loads(report.read_text())
          safe_fields = ("RuleID", "Description", "File", "Commit", "StartLine", "EndLine", "Fingerprint")
          print(f"Historical Gitleaks findings: {len(findings)}; secret values are omitted.")
          for item in findings:
              print(json.dumps({key: item.get(key) for key in safe_fields}, sort_keys=True))
          report.unlink(missing_ok=True)
          PY
          echo "Gitleaks full-history exit status: $scan_status"
          echo "Audit only: findings must be reviewed before any narrow, evidence-based disposition."
