name: Secret Scan (Introduced Changes)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-introduced-secrets:
    name: Scan introduced Git changes with Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine commit range
        id: range
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test -n "$PR_BASE_SHA"
            echo "value=$PR_BASE_SHA..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            parent="$(git rev-parse "${GITHUB_SHA}^")"
            echo "value=$parent..${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Scan introduced commits
        shell: bash
        env:
          SCAN_RANGE: ${{ steps.range.outputs.value }}
        run: |
          set -euo pipefail
          echo "Scanning introduced commit range: $SCAN_RANGE"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            zricethezav/gitleaks:v8.24.3 \
            git --redact --exit-code 1 --log-opts="$SCAN_RANGE" .
