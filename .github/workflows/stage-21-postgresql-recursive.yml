name: Stage 21 PostgreSQL Recursive Compiler
on:
  pull_request:
    paths:
      - "packages/compiler-postgresql-recursive/**"
      - "packages/planner/**"
      - "packages/graph-api/**"
      - "packages/query-ir/**"
      - "infra/docker/postgres/**"
      - "tests/postgresql-recursive-compiler/**"
      - "tests/planner/**"
      - "tests/graph-api/**"
      - "knowledge/decisions/bidirectional-mcp-developer-first.md"
      - "knowledge/decisions/engine-neutral-planner.md"
      - "knowledge/mcp.md"
      - "knowledge/architecture.md"
      - "AGENTS.md"
      - "BUILD_PLAN.md"
      - "BUILD_STATE.md"
  push:
    branches: [main, stage21-agent-developer-contract]
jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Compiler and planner contract tests
        run: |
          node --test tests/postgresql-recursive-compiler/*.test.mjs
          node tests/planner/planner.test.mjs
          node --test tests/graph-api/api.test.mjs
      - name: Build PostgreSQL image
        run: docker build -t leruchi-stage21 -f infra/docker/postgres/Dockerfile .
      - name: Start PostgreSQL
        run: |
          docker run -d --name leruchi-stage21-db -p 55435:5432             -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=leruchi             -e LERUCHI_MIGRATOR_PASSWORD=migrator -e LERUCHI_RUNTIME_PASSWORD=runtime -e LERUCHI_REALTIME_PASSWORD=realtime             -v "$GITHUB_WORKSPACE/infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro" leruchi-stage21
          for attempt in $(seq 1 60); do
            docker exec leruchi-stage21-db pg_isready -U postgres -d leruchi >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker logs leruchi-stage21-db
          exit 1
      - name: Database traversal, RLS, depth, limit and parameter-safety evidence
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55435/leruchi
          DATABASE_URL: postgresql://vibe_runtime:runtime@127.0.0.1:55435/leruchi
        run: node tests/postgresql-recursive-compiler/integration.mjs
      - name: Database logs on failure
        if: failure()
        run: docker logs leruchi-stage21-db || true
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f leruchi-stage21-db >/dev/null 2>&1 || true
      - name: Architecture regression audit
        run: node tests/architecture/contract-audit.mjs
