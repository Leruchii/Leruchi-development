name: Stage 04 Schema Catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build VibeDB database image
        run: docker compose build db

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database
        run: |
          for i in {1..90}; do
            if docker compose exec -T db pg_isready -U postgres -d vibedb; then exit 0; fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Install Schema Catalog
        run: |
          docker compose exec -T db psql -U postgres -d vibedb -Xf /dev/stdin < infra/catalog/04-schema-catalog.sql

      - name: Run catalog assertions
        run: |
          docker compose exec -T db psql -U vibe_runtime -d vibedb -Xf /dev/stdin < tests/catalog/stage-04.sql

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db

      - name: Cleanup
        if: always()
        run: docker compose down -v
