name: Stage 04 Schema Catalog

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build VibeDB database image
        run: docker compose build db

      - name: Start database
        run: docker compose up -d db

      - name: Wait for database
        run: |
          for i in {1..90}; do
            if docker compose exec -T db pg_isready -U postgres -d vibedb; then exit 0; fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Install Schema Catalog
        run: |
          docker compose exec -T db psql -U postgres -d vibedb -Xf /dev/stdin < infra/catalog/04-schema-catalog.sql

      - name: Prove deterministic refresh
        run: |
          docker compose exec -T db psql -U postgres -d vibedb -v ON_ERROR_STOP=1 -X <<'SQL'
          SELECT md5(string_agg(
            catalog_version || '|' || object_kind || '|' || schema_name || '|' ||
            object_name || '|' || parent_name || '|' || metadata::text,
            E'\n' ORDER BY catalog_version, object_kind, schema_name, object_name, parent_name
          )) AS before_hash
          FROM vibe_meta.schema_catalog_entries;
          SELECT vibe_meta.refresh_schema_catalog();
          SELECT md5(string_agg(
            catalog_version || '|' || object_kind || '|' || schema_name || '|' ||
            object_name || '|' || parent_name || '|' || metadata::text,
            E'\n' ORDER BY catalog_version, object_kind, schema_name, object_name, parent_name
          )) AS after_hash
          FROM vibe_meta.schema_catalog_entries;
          SQL

      - name: Run runtime catalog assertions
        run: |
          docker compose exec -T db psql -U vibe_runtime -d vibedb -Xf /dev/stdin < tests/catalog/stage-04.sql

      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db

      - name: Cleanup
        if: always()
        run: docker compose down -v
