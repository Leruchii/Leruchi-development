name: Stage 26B - Agent Native Context IR

on:
  pull_request:
    paths:
      - "packages/context-ir/**"
      - "packages/vibe-sdk/context.mjs"
      - "packages/vibe-sdk/index.mjs"
      - "packages/mcp-server/index.mjs"
      - "packages/graph-api/index.mjs"
      - "tests/context-ir/**"
      - "tests/vibe-sdk/context.test.mjs"
  push:
    branches:
      - "stage26b-*"

jobs:
  context-ir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Context IR tests
        run: node --test tests/context-ir/*.test.mjs tests/vibe-sdk/context.test.mjs
      - name: MCP server tests
        run: node --test tests/mcp/mcp-server.test.mjs
