name: Stage 27 - Agent Intent Boundary

on:
  pull_request:
    paths:
      - "packages/agent-intent/**"
      - "packages/graph-api/**"
      - "packages/leruchi-sdk/**"
      - "packages/mcp-server/**"
      - "tests/agent-intent/**"
      - "tests/leruchi-sdk/agent-intent.test.mjs"
      - "tests/mcp/mcp-server.test.mjs"
      - "tests/graph-api/api.test.mjs"
      - "packages/leruchi-cli/**"
      - "tests/cli/cli.test.mjs"
  push:
    branches:
      - "stage27-*"

jobs:
  agent-intent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Agent Intent contract tests
        run: node --test tests/agent-intent/*.test.mjs
      - name: SDK Agent Intent tests
        run: node --test tests/leruchi-sdk/agent-intent.test.mjs
      - name: MCP contract tests
        run: node --test tests/mcp/mcp-server.test.mjs
      - name: Graph API Agent Intent tests
        run: node --test tests/graph-api/api.test.mjs
      - name: CLI Agent Intent tests
        run: node --test tests/cli/cli.test.mjs
