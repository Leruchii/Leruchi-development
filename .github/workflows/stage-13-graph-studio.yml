name: Stage 13 Graph Studio
on:
  pull_request:
  push:
    branches: [main]
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/studio/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install runtime dependencies
        working-directory: .
        run: npm install --no-audit --no-fund
      - name: Graph API boundary tests
        working-directory: .
        run: node --test tests/graph-api/api.test.mjs
      - name: Build database image
        working-directory: .
        run: docker compose build db
      - name: Start database
        working-directory: .
        run: docker compose up -d db
      - name: Wait for database
        working-directory: .
        run: |
          for i in {1..90}; do
            if docker compose exec -T db pg_isready -U postgres -d leruchi; then exit 0; fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - name: Seed live Studio tenant data
        working-directory: .
        run: docker compose exec -T db bash -lc 'bash -s' < tests/security/stage-02-setup.sh
      - name: Generate ephemeral EdDSA test keypair
        working-directory: .
        run: |
          openssl genpkey -algorithm ED25519 -out /tmp/leruchi-capability-test-private.pem
          openssl pkey -in /tmp/leruchi-capability-test-private.pem -pubout -outform DER | base64 -w0 > /tmp/leruchi-capability-test-public.b64
      - name: Start test capability control plane
        working-directory: .
        env:
          LERUCHI_CONTROL_PLANE_TOKEN: stage-13-control-plane-secret
          LERUCHI_CONTROL_PLANE_PORT: 4101
        run: node scripts/start-test-capability-control-plane.mjs > /tmp/leruchi-stage13-control-plane.log 2>&1 &
      - name: Wait for test capability control plane
        working-directory: .
        run: |
          for i in {1..30}; do
            if grep -q test-control-plane-ready /tmp/leruchi-stage13-control-plane.log 2>/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/leruchi-stage13-control-plane.log || true
          exit 1
      - name: Start live Graph API
        working-directory: .
        env:
          LERUCHI_RUNTIME_DATABASE_URL: postgresql://vibe_runtime:runtime@127.0.0.1:5432/leruchi
          LERUCHI_CAPABILITY_ISSUER: leruchi-test-control-plane
          LERUCHI_CAPABILITY_CONTROL_PLANE_URL: http://127.0.0.1:4101
          LERUCHI_CAPABILITY_CONTROL_PLANE_TOKEN: stage-13-control-plane-secret
          LERUCHI_GRAPH_API_PORT: 4100
        run: |
          export LERUCHI_CAPABILITY_PUBLIC_KEYS="{\"stage-test-2026\":\"$(cat /tmp/leruchi-capability-test-public.b64)\"}"
          node scripts/start-stage13-graph-api.mjs > /tmp/leruchi-stage13-api.log 2>&1 &
      - name: Configure live Studio endpoint
        run: echo 'LERUCHI_API_URL=http://127.0.0.1:4100' >> "$GITHUB_ENV"
      - name: Wait for live Graph API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4100/health >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/leruchi-stage13-api.log || true
          exit 1
      - name: Renderer benchmark
        working-directory: .
        run: node scripts/benchmark-graph-renderer.mjs
      - name: Studio tenant-render contract
        working-directory: .
        run: node --test tests/studio/tenant-render-contract.test.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tenant/responsive evidence
        env:
          LERUCHI_CAPABILITY_TEST_PRIVATE_KEY_PATH: /tmp/leruchi-capability-test-private.pem
        run: npm run test:browser
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Show live Graph API logs on failure
        if: failure()
        run: cat /tmp/leruchi-stage13-api.log /tmp/leruchi-stage13-control-plane.log || true
      - name: Cleanup live database
        if: always()
        working-directory: .
        run: docker compose down -v
      - name: Base UI audit
        working-directory: .
        run: bash scripts/audit-baseui.sh apps/studio
