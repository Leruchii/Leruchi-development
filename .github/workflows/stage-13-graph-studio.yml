name: Stage 13 Graph Studio
on:
  pull_request:
  push:
    branches: [main]
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install runtime dependencies
        working-directory: .
        run: npm install --no-audit --no-fund
      - name: Graph API boundary tests
        working-directory: .
        run: node --test tests/graph-api/api.test.mjs
      - name: Renderer benchmark
        working-directory: .
        run: node scripts/benchmark-graph-renderer.mjs
      - name: Studio tenant-render contract
        working-directory: .
        run: node --test tests/studio/tenant-render-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Base UI audit
        working-directory: .
        run: bash scripts/audit-baseui.sh apps/studio
