name: Stage 13 Graph Studio
on:
  pull_request:
  push:
    branches: [main]
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install runtime dependencies
        working-directory: .
        run: npm install --no-audit --no-fund
      - name: Graph API boundary tests
        working-directory: .
        run: node --test tests/graph-api/api.test.mjs
      - name: Renderer benchmark
        working-directory: .
        run: node scripts/benchmark-graph-renderer.mjs
      - name: Studio tenant-render contract
        working-directory: .
        run: node --test tests/studio/tenant-render-contract.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Base UI audit
        working-directory: .
        run: bash scripts/audit-baseui.sh apps/studio
      - name: Start Studio
        run: PORT=3100 npm run start > /tmp/vibedb-studio.log 2>&1 &
      - name: Wait for Studio
        working-directory: .
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100 >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/vibedb-studio.log
          exit 1
      - name: Install Chromium
        working-directory: .
        run: npx -y playwright@1.55.0 install --with-deps chromium
      - name: Browser tenant and responsive evidence
        working-directory: .
        run: npx -y -p @playwright/test@1.55.0 playwright test tests/studio/browser.spec.mjs
