name: Stage 13 Graph Studio
on:
  pull_request:
  push:
    branches: [main]
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Renderer spike benchmark
        working-directory: .
        run: node tests/studio/renderer-benchmark.mjs
      - name: Graph API contract tests
        timeout-minutes: 2
        working-directory: .
        run: node --test tests/graph-api/api.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Base UI audit
        working-directory: .
        run: bash scripts/audit-baseui.sh apps/studio
