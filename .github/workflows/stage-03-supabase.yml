name: Stage 03 Supabase compatibility

on:
  pull_request:
  push:
    branches: [main]

jobs:
  supabase-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify Supabase role credentials
        run: node --test tests/security/supabase-role-credentials.test.mjs
      - name: Verify tenant-claim hook contract
        run: node --test tests/security/tenant-claim-hook-contract.test.mjs

      - name: Build Leruchi database image
        run: docker compose build db

      - name: Start Leruchi database
        run: docker compose up -d db

      - name: Wait for database
        run: |
          for i in {1..90}; do
            if docker compose exec -T db pg_isready -U postgres -d vibedb; then exit 0; fi
            sleep 2
          done
          docker compose logs db
          exit 1

      - name: Install Supabase compatibility roles and RLS probe
        run: |
          docker compose exec -T db psql -U postgres -d vibedb -Xf /dev/stdin < infra/supabase/roles.sql

      - name: Start Auth and PostgREST
        run: GOTRUE_EXTERNAL_EMAIL_ENABLED=true GOTRUE_DISABLE_SIGNUP=false GOTRUE_MAILER_AUTOCONFIRM=true docker compose -f docker-compose.yml -f infra/supabase/docker-compose.yml up -d --force-recreate auth rest

      - name: Wait for Auth and PostgREST
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9999/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9999/health
          curl -fsS http://127.0.0.1:3000/

      - name: Install tenant-claim hook
        run: docker compose exec -T db psql -U postgres -d vibedb -v ON_ERROR_STOP=1 -Xf /dev/stdin < infra/supabase/tenant-claim-hook.sql

      - name: Verify tenant-claim hook permissions
        run: |
          docker compose exec -T db psql -U postgres -d vibedb -v ON_ERROR_STOP=1 -X <<'SQL'
          DO $check$
          BEGIN
            IF to_regprocedure('vibe_auth.custom_access_token_hook(jsonb)') IS NULL THEN
              RAISE EXCEPTION 'tenant-claim hook function is missing';
            END IF;
            IF NOT has_function_privilege('supabase_auth_admin', 'vibe_auth.custom_access_token_hook(jsonb)', 'EXECUTE') THEN
              RAISE EXCEPTION 'Auth admin cannot execute tenant-claim hook';
            END IF;
            IF NOT has_table_privilege('supabase_auth_admin', 'vibe_auth.user_tenant_memberships', 'SELECT') THEN
              RAISE EXCEPTION 'Auth admin cannot read membership records';
            END IF;
            IF has_table_privilege('authenticated', 'vibe_auth.user_tenant_memberships', 'SELECT') THEN
              RAISE EXCEPTION 'Authenticated clients must not read membership records';
            END IF;
            IF has_schema_privilege('authenticated', 'vibe_auth', 'USAGE') THEN
              RAISE EXCEPTION 'Authenticated clients must not use the private auth schema';
            END IF;
          END
          $check$;
          SQL

      - name: Verify unbound tenant claims fail closed
        run: |
          docker compose exec -T db psql -U postgres -d vibedb -v ON_ERROR_STOP=1 -X <<'SQL'
          SET ROLE supabase_auth_admin;
          DO $check$
          DECLARE
            claims jsonb;
          BEGIN
            claims := vibe_auth.custom_access_token_hook(jsonb_build_object(
              'user_id', '00000000-0000-0000-0000-000000000199',
              'claims', jsonb_build_object('tenant_id', 'tenant_b')
            ))->'claims';
            IF claims ? 'tenant_id' THEN
              RAISE EXCEPTION 'Unbound caller-supplied tenant_id must be removed';
            END IF;
          END
          $check$;
          RESET ROLE;
          SQL

      - name: Create Auth users, issue tenant claims and verify RLS isolation
        run: |
          ANON_TOKEN=$(python3 - <<'PY'
          import base64, hashlib, hmac, json, time
          secret=b"vibe-stage-03-jwt-secret-change-me-32"
          def b64(v):
              return base64.urlsafe_b64encode(v).rstrip(b"=").decode()
          header=b64(json.dumps({"alg":"HS256","typ":"JWT"},separators=(",",":")).encode())
          payload=b64(json.dumps({"role":"anon","aud":"authenticated","iss":"http://localhost:9999","iat":int(time.time()),"exp":int(time.time())+600},separators=(",",":")).encode())
          msg=f"{header}.{payload}".encode()
          sig=b64(hmac.new(secret,msg,hashlib.sha256).digest())
          print(f"{header}.{payload}.{sig}")
          PY
          )
          SIGNUP_A=$(curl -fsS -X POST "http://127.0.0.1:9999/signup" -H "apikey: ${ANON_TOKEN}" -H "Content-Type: application/json" --data '{"email":"stage03-tenant-a@example.test","password":"Stage03-Password-24!","data":{"active_tenant_id":"tenant_a"}}')
          SIGNUP_B=$(curl -fsS -X POST "http://127.0.0.1:9999/signup" -H "apikey: ${ANON_TOKEN}" -H "Content-Type: application/json" --data '{"email":"stage03-tenant-b@example.test","password":"Stage03-Password-24!","data":{"active_tenant_id":"tenant_b"}}')
          USER_A_ID=$(printf '%s' "${SIGNUP_A}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or d.get("user",{}).get("id",""))')
          USER_B_ID=$(printf '%s' "${SIGNUP_B}" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id") or d.get("user",{}).get("id",""))')
          test -n "${USER_A_ID}"
          test -n "${USER_B_ID}"
          docker compose exec -T db psql -U postgres -d vibedb -v ON_ERROR_STOP=1 -v user_a="${USER_A_ID}" -v user_b="${USER_B_ID}" -Xf /dev/stdin < tests/security/tenant-claim-hook-fixture.sql
          TOKEN_A=$(curl -fsS -X POST "http://127.0.0.1:9999/token?grant_type=password" -H "apikey: ${ANON_TOKEN}" -H "Content-Type: application/json" --data '{"email":"stage03-tenant-a@example.test","password":"Stage03-Password-24!"}')
          TOKEN_B=$(curl -fsS -X POST "http://127.0.0.1:9999/token?grant_type=password" -H "apikey: ${ANON_TOKEN}" -H "Content-Type: application/json" --data '{"email":"stage03-tenant-b@example.test","password":"Stage03-Password-24!"}')
          python3 - "${TOKEN_A}" "${TOKEN_B}" <<'PY'
          import base64, json, sys
          def claims(response):
              token=json.loads(response)["access_token"]
              part=token.split(".")[1]
              return json.loads(base64.urlsafe_b64decode(part+"="*(-len(part)%4)))
          a,b=claims(sys.argv[1]),claims(sys.argv[2])
          assert a.get("tenant_id")=="tenant_a", f"active membership did not issue tenant_a: {a}"
          assert "tenant_id" not in b, f"revoked tenant selector issued tenant_id: {b}"
          print("Real Auth-issued tenant claim assertions passed")
          PY
          ACCESS_A=$(printf '%s' "${TOKEN_A}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          ACCESS_B=$(printf '%s' "${TOKEN_B}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          RESPONSE_A=$(curl -fsS -H "Authorization: Bearer ${ACCESS_A}" "http://127.0.0.1:3000/supabase_rls_probe?select=id,tenant_id,payload")
          echo "${RESPONSE_A}"
          echo "${RESPONSE_A}" | grep -q '"tenant_a"'
          if echo "${RESPONSE_A}" | grep -q 'tenant_b'; then echo "Tenant B leaked into Tenant A response"; exit 1; fi
          RESPONSE_B=$(curl -fsS -H "Authorization: Bearer ${ACCESS_B}" "http://127.0.0.1:3000/supabase_rls_probe?select=id,tenant_id,payload")
          echo "${RESPONSE_B}"
          if echo "${RESPONSE_B}" | grep -q 'tenant_a\|tenant_b'; then echo "Token without authorized tenant claim returned tenant rows"; exit 1; fi

      - name: Verify tenant claim resists tampering and drops on revocation
        run: |
          ANON_TOKEN=$(python3 - <<'PY'
          import base64, hashlib, hmac, json, time
          secret=b"vibe-stage-03-jwt-secret-change-me-32"
          b64=lambda v: base64.urlsafe_b64encode(v).rstrip(b"=").decode()
          h=b64(json.dumps({"alg":"HS256","typ":"JWT"},separators=(",",":")).encode())
          p=b64(json.dumps({"role":"anon","aud":"authenticated","iss":"http://localhost:9999","iat":int(time.time()),"exp":int(time.time())+600},separators=(",",":")).encode())
          print(f"{h}.{p}.{b64(hmac.new(secret,f'{h}.{p}'.encode(),hashlib.sha256).digest())}")
          PY
          )
          auth() { curl -fsS -H "apikey: ${ANON_TOKEN}" -H "Content-Type: application/json" "$@"; }
          jget() { python3 -c "import json,sys; print(json.load(sys.stdin).get('$1',''))"; }
          tenant_of() { python3 -c "
          import base64,json,sys
          t=sys.stdin.read().strip().split('.')[1]
          print(json.loads(base64.urlsafe_b64decode(t+'='*(-len(t)%4))).get('tenant_id',''))"; }

          LOGIN=$(auth -X POST "http://127.0.0.1:9999/token?grant_type=password" \
            --data '{"email":"stage03-tenant-a@example.test","password":"Stage03-Password-24!"}')
          ACCESS=$(printf '%s' "$LOGIN" | jget access_token)
          REFRESH=$(printf '%s' "$LOGIN" | jget refresh_token)
          USER_A_ID=$(printf '%s' "$LOGIN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["user"]["id"])')
          test -n "$USER_A_ID"

          # 1. Tampering: the user rewrites their own metadata to select a revoked tenant and plants a fake tenant_id.
          auth -X PUT "http://127.0.0.1:9999/user" -H "Authorization: Bearer ${ACCESS}" \
            --data '{"data":{"active_tenant_id":"tenant_b","tenant_id":"tenant_b"}}' >/dev/null
          R1=$(auth -X POST "http://127.0.0.1:9999/token?grant_type=refresh_token" --data "{\"refresh_token\":\"${REFRESH}\"}")
          T1=$(printf '%s' "$R1" | jget access_token | tenant_of)
          test "$T1" != "tenant_b" || { echo "Tampered metadata issued tenant_b"; exit 1; }
          test -z "$T1" || { echo "Invalid tenant selector must issue no tenant claim, got: $T1"; exit 1; }
          REFRESH=$(printf '%s' "$R1" | jget refresh_token)

          # 2. Restore a valid selector, confirm the claim returns, then revoke the membership.
          auth -X PUT "http://127.0.0.1:9999/user" -H "Authorization: Bearer $(printf '%s' "$R1" | jget access_token)" \
            --data '{"data":{"active_tenant_id":"tenant_a"}}' >/dev/null
          R2=$(auth -X POST "http://127.0.0.1:9999/token?grant_type=refresh_token" --data "{\"refresh_token\":\"${REFRESH}\"}")
          test "$(printf '%s' "$R2" | jget access_token | tenant_of)" = "tenant_a"
          REFRESH=$(printf '%s' "$R2" | jget refresh_token)
          OLD_ACCESS=$(printf '%s' "$R2" | jget access_token)

          docker compose exec -T db psql -U postgres -d vibedb -v ON_ERROR_STOP=1 -Xc \
            "UPDATE vibe_auth.user_tenant_memberships SET membership_status='revoked' WHERE user_id='${USER_A_ID}' AND tenant_id='tenant_a';"

          R3=$(auth -X POST "http://127.0.0.1:9999/token?grant_type=refresh_token" --data "{\"refresh_token\":\"${REFRESH}\"}")
          T3=$(printf '%s' "$R3" | jget access_token | tenant_of)
          test -z "$T3" || { echo "Revoked membership still issued tenant claim: $T3"; exit 1; }
          NEW_ACCESS=$(printf '%s' "$R3" | jget access_token)
          BODY=$(curl -fsS -H "Authorization: Bearer ${NEW_ACCESS}" "http://127.0.0.1:3000/supabase_rls_probe?select=tenant_id")
          if echo "$BODY" | grep -q 'tenant_'; then echo "Refreshed token without claim still read tenant rows"; exit 1; fi

          # 3. Residual window: an access token issued before revocation stays valid until GOTRUE_JWT_EXP.
          if curl -fsS -H "Authorization: Bearer ${OLD_ACCESS}" "http://127.0.0.1:3000/supabase_rls_probe?select=tenant_id" | grep -q 'tenant_a'; then
            echo "Documented window: pre-revocation access token remains valid until GOTRUE_JWT_EXP (3600s)"
          fi

          docker compose exec -T db psql -U postgres -d vibedb -v ON_ERROR_STOP=1 -Xc \
            "UPDATE vibe_auth.user_tenant_memberships SET membership_status='active' WHERE user_id='${USER_A_ID}' AND tenant_id='tenant_a';"

      - name: Verify signed JWT reaches PostgREST RLS
        run: |
          TOKEN=$(python3 - <<'PY'
          import base64, hashlib, hmac, json, time
          secret=b"vibe-stage-03-jwt-secret-change-me-32"
          def b64(v):
              return base64.urlsafe_b64encode(v).rstrip(b"=").decode()
          header=b64(json.dumps({"alg":"HS256","typ":"JWT"},separators=(",",":")).encode())
          payload=b64(json.dumps({"role":"authenticated","tenant_id":"tenant_a","aud":"authenticated","iss":"http://localhost:9999","exp":int(time.time())+300},separators=(",",":")).encode())
          msg=f"{header}.{payload}".encode()
          sig=b64(hmac.new(secret,msg,hashlib.sha256).digest())
          print(f"{header}.{payload}.{sig}")
          PY
          )
          RESPONSE=$(curl -fsS             -H "Authorization: Bearer ${TOKEN}"             "http://127.0.0.1:3000/supabase_rls_probe?select=id,tenant_id,payload")
          echo "${RESPONSE}"
          echo "${RESPONSE}" | grep -q '"tenant_a"'
          if echo "${RESPONSE}" | grep -q 'tenant_b'; then
            echo "Tenant B leaked through PostgREST"
            exit 1
          fi

      - name: Show service logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f infra/supabase/docker-compose.yml logs auth rest db

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f infra/supabase/docker-compose.yml down -v
