name: Stage 12 Graph Realtime
on:
  pull_request:
  push:
    branches: [main]
jobs:
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run realtime contract tests
        run: node --test tests/realtime/realtime.test.mjs
      - name: Build database image
        run: docker compose build db
      - name: Start database
        run: docker compose up -d db
      - name: Wait for database
        run: |
          for i in {1..90}; do
            if docker compose exec -T db pg_isready -U postgres -d vibedb; then exit 0; fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - name: Install Schema Catalog baseline
        run: docker compose exec -T db psql -U postgres -d vibedb -v ON_ERROR_STOP=1 -Xf /dev/stdin < infra/catalog/04-schema-catalog.sql
      - name: Apply migrations as approved migrator
        env:
          VIBE_MIGRATOR_DATABASE_URL: postgresql://vibe_migrator:migrator@127.0.0.1:5432/vibedb
        run: node -e "import('./packages/vibe-cli/migrate.mjs').then(async ({runMigrations}) => console.log(await runMigrations({cwd:process.cwd()})))"
      - name: Prove relay role cannot bypass RLS
        run: |
          docker compose exec -T db psql -U postgres -d vibedb -v ON_ERROR_STOP=1 -X <<'SQL'
          SELECT rolname, rolsuper, rolbypassrls
            FROM pg_roles
           WHERE rolname='vibe_realtime';
          DO $vibe$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles
               WHERE rolname='vibe_realtime'
                 AND rolsuper=false
                 AND rolbypassrls=false
            ) THEN
              RAISE EXCEPTION 'vibe_realtime must be NOSUPERUSER/NOBYPASSRLS';
            END IF;
          END $vibe$;
          SQL
      - name: Run architecture regression audit
        run: node tests/architecture/contract-audit.mjs
      - name: Run database-backed realtime integration
        timeout-minutes: 2
        env:
          VIBE_RUNTIME_DATABASE_URL: postgresql://vibe_runtime:runtime@127.0.0.1:5432/vibedb
          VIBE_REALTIME_DATABASE_URL: postgresql://vibe_realtime:realtime@127.0.0.1:5432/vibedb
          RUN_STAGE12_INTEGRATION: "1"
        run: node --test tests/realtime/stage-12-integration.mjs
      - name: Show database logs on failure
        if: failure()
        run: docker compose logs db
      - name: Cleanup
        if: always()
        run: docker compose down -v
