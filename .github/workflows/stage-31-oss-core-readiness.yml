name: Stage 31 - OSS Core Readiness

on:
  pull_request:
    paths:
      # Any change eligible for the public export must rerun readiness.
      - "OSS_EXPORT_MANIFEST.json"
      - "README.md"
      - ".nvmrc"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "docs/**"
      - "packages/**"
      - "apps/studio/**"
      - "infra/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "docker-compose.yml"
      - "scripts/public-*.mjs"
      - "scripts/leruchi-backup.sh"
      - "scripts/leruchi-restore.sh"
      - "scripts/vibedb-backup.sh"
      - "scripts/vibedb-restore.sh"
      # Private gate inputs also need to rerun the readiness checks.
      - "security/**"
      - "scripts/assert-runtime-policy.mjs"
      - "scripts/verify-third-party-notices.mjs"
      - "scripts/oss-core-readiness-audit.mjs"
      - "scripts/owasp-asvs-verification.mjs"
      - "scripts/public-oss-export-audit.mjs"
      - "scripts/build-oss-core-candidate.mjs"
      - "tests/architecture/runtime-policy.test.mjs"
      - "tests/oss-core-readiness/**"
      - "tests/agent-governance/**"
      - "tests/security/realtime-role-boundary.test.mjs"
      - "tests/security/owasp-asvs-profile.test.mjs"
      - "packages/agent-governance/**"
      - "knowledge/decisions/stage-31-oss-core-readiness.md"
      - "knowledge/decisions/integration-review-stage32.md"
      - "knowledge/decisions/product-naming-review.md"
      - ".github/workflows/stage-31-oss-core-readiness.yml"
      - ".github/workflows/stage-32-oss-publication-candidate.yml"
  push:
    branches:
      - "stage31-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  oss-core-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Enforce runtime policy
        run: node scripts/assert-runtime-policy.mjs
      - name: Run runtime policy regression tests
        run: node --test tests/architecture/runtime-policy.test.mjs
      - name: Run OSS readiness tests
        run: node --test tests/oss-core-readiness/*.test.mjs
      - name: Run Agent Governance tests
        run: node --test tests/agent-governance/agent-governance.test.mjs
      - name: Run OWASP ASVS 5.0.0 verification gate
        run: node scripts/owasp-asvs-verification.mjs && node --test tests/security/owasp-asvs-profile.test.mjs
      - name: Verify third-party dependency license inventory
        run: node scripts/verify-third-party-notices.mjs
      - name: Validate public export manifest
        run: node tests/oss-core-readiness/public-export-manifest.test.mjs && node scripts/public-oss-export-audit.mjs
      - name: Build sanitized OSS candidate
        run: |
          candidate="$RUNNER_TEMP/leruchi-oss-candidate"
          mkdir -p "$candidate"
          node scripts/build-oss-core-candidate.mjs "$GITHUB_WORKSPACE" "$candidate"
          node scripts/oss-core-readiness-audit.mjs "$candidate"
