name: Stage 17 Backup and Recovery
on:
  pull_request:
    paths:
      - "scripts/vibedb-backup.sh"
      - "scripts/vibedb-restore.sh"
      - "packages/backup-recovery/**"
      - "tests/backup-recovery/**"
      - "infra/docker/postgres/**"
      - ".github/workflows/stage-17-backup-recovery.yml"
  push:
    branches: [main, stage17-backup-recovery]
jobs:
  backup-recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vibedb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vibedb"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vibedb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Backup contract tests
        run: node --test tests/backup-recovery/backup-recovery.test.mjs
      - name: PostgreSQL 17 recovery drill
        run: docker run --rm --network host -v "$GITHUB_WORKSPACE:/workspace" -w /workspace -e DATABASE_URL="$DATABASE_URL" postgres:17 bash tests/backup-recovery/backup-recovery-drill.sh
      - name: Build production VibeDB database image
        run: docker build -t vibedb-stage17 -f infra/docker/postgres/Dockerfile .
      - name: Start production VibeDB recovery source
        run: |
          docker run -d --name vibedb-stage17-db \
            -p 55432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=vibedb \
            -e VIBE_MIGRATOR_PASSWORD=migrator \
            -e VIBE_RUNTIME_PASSWORD=runtime \
            -e VIBE_REALTIME_PASSWORD=realtime \
            -v "$GITHUB_WORKSPACE/infra/docker/postgres/init:/docker-entrypoint-initdb.d:ro" \
            vibedb-stage17
          for attempt in $(seq 1 60); do
            if docker exec vibedb-stage17-db pg_isready -U postgres -d vibedb >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs vibedb-stage17-db
          exit 1
      - name: Production AGE + pgvector recovery drill
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            -e SOURCE_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:55432/vibedb" \
            -e TARGET_DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:55432/vibedb_restore" \
            vibedb-stage17 \
            bash tests/backup-recovery/production-image-recovery-drill.sh
      - name: Production database logs on failure
        if: failure()
        run: docker logs vibedb-stage17-db || true
      - name: Stop production VibeDB recovery source
        if: always()
        run: docker rm -f vibedb-stage17-db >/dev/null 2>&1 || true
      - name: Architecture regression audit
        run: node tests/architecture/contract-audit.mjs
